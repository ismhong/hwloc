# SPDX-License-Identifier: BSD-3-Clause
#
# Static musl Release
# ====================
#
# Builds fully statically linked hwloc command-line executables using
# musl libc (via Alpine Linux) for x86_64 and aarch64, then attaches
# them as release assets.
#
# Triggered by pushing a tag matching v*.
#
# Build strategy
# --------------
# Each architecture is built inside an Alpine Linux Docker container
# running under QEMU user-mode emulation on a standard GitHub Actions
# x86_64 runner.  Alpine uses musl by default, so the resulting
# executables have no glibc dependency.  Combined with libtool's
# -all-static flag, every executable is fully statically linked.
#
# Based on: https://github.com/open-mpi/hwloc/wiki/StaticBuild

name: Static musl Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform Docker builds
        uses: docker/setup-qemu-action@v3

      - name: Build static binaries with musl libc
        run: |
          docker run --platform ${{ matrix.platform }} \
            -v "$PWD":/work -w /work \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -e ARCH=${{ matrix.arch }} \
            alpine:3.20 \
            /work/contrib/ci/static-build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hwloc-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: false

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: hwloc-linux-*/*.tar.gz
          generate_release_notes: true
